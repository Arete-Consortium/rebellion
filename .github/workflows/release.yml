name: Release

on:
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to release (e.g., 1.0.0)'
        required: true
        type: string

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always

jobs:
  build-release:
    name: Build (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            artifact: linux-x64
            package_dir: dist/linux-release
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            artifact: windows-x64
            package_dir: dist/windows-release
          - os: macos-latest
            target: x86_64-apple-darwin
            artifact: macos-x64
            package_dir: dist/macos-release

    steps:
      - uses: actions/checkout@v7

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Install Linux dependencies
        if: matrix.os == 'ubuntu-latest'
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential pkg-config libasound2-dev libudev-dev libxkbcommon-dev libwayland-dev libx11-dev libxrandr-dev libxi-dev libxcursor-dev libxinerama-dev

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2

      - name: Fetch locked dependencies
        run: cargo fetch --locked --target ${{ matrix.target }}

      - name: Package (Linux)
        if: matrix.os == 'ubuntu-latest'
        run: bash scripts/package-linux-playtest.sh "${{ matrix.package_dir }}"

      - name: Package (macOS)
        if: matrix.os == 'macos-latest'
        run: bash scripts/package-macos-playtest.sh ${{ matrix.target }} release Rebellion "${{ matrix.package_dir }}"

      - name: Package (Windows)
        if: matrix.os == 'windows-latest'
        shell: pwsh
        run: ./scripts/package-windows-playtest.ps1 -OutputDir '${{ matrix.package_dir }}'

      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.artifact }}
          path: |
            ${{ matrix.package_dir }}/*.tar.gz
            ${{ matrix.package_dir }}/*.zip
            ${{ matrix.package_dir }}/*.sha256
          if-no-files-found: error
          retention-days: 7

  create-release:
    name: Create Release
    runs-on: ubuntu-latest
    needs: [build-release, build-wasm]
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Download native release archives
        uses: actions/download-artifact@v8
        with:
          pattern: "*-x64"
          path: artifacts

      - name: Generate changelog
        id: changelog
        run: |
          {
            echo "CHANGELOG<<CHANGELOG_EOF_MARKER"
            git log $(git describe --tags --abbrev=0 HEAD^ 2>/dev/null || echo "")..HEAD --pretty=format:"- %s (%h)" || echo "- Initial release"
            echo ""
            echo "CHANGELOG_EOF_MARKER"
          } >> $GITHUB_OUTPUT

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          files: artifacts/**/*
          body: |
            ## What's Changed
            ${{ steps.changelog.outputs.CHANGELOG }}

            ## Downloads
            | Platform | Download |
            |----------|----------|
            | Linux x64 | `Rebellion-linux-x86_64.tar.gz` |
            | Windows x64 | `Rebellion-windows-x86_64.zip` |
            | macOS x64 | `Rebellion.app.zip` |
            | Web (itch.io) | [Play in browser](https://aretedriver.itch.io/rebellion) |
          draft: false
          prerelease: ${{ contains(github.ref, 'alpha') || contains(github.ref, 'beta') || contains(github.ref, 'rc') }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  build-wasm:
    name: Build Web (WASM)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2

      - name: Install matching wasm-bindgen-cli
        run: |
          VERSION=$(python3 -c 'import tomllib; print(next(p["version"] for p in tomllib.load(open("Cargo.lock", "rb"))["package"] if p["name"] == "wasm-bindgen"))')
          cargo install wasm-bindgen-cli --locked --version "$VERSION"

      - name: Build canonical Web package
        run: bash build-wasm.sh dist/web-release

      - name: Upload WASM artifact
        uses: actions/upload-artifact@v7
        with:
          name: web-wasm
          path: dist/web-release/
          retention-days: 7

  deploy-itch:
    name: Deploy to itch.io
    runs-on: ubuntu-latest
    needs: [build-release, build-wasm]
    continue-on-error: true
    steps:
      - name: Download Linux artifact
        uses: actions/download-artifact@v8
        with:
          name: linux-x64
          path: linux

      - name: Download Windows artifact
        uses: actions/download-artifact@v8
        with:
          name: windows-x64
          path: windows

      - name: Download WASM artifact
        uses: actions/download-artifact@v8
        with:
          name: web-wasm
          path: web

      - name: Extract Linux build
        run: |
          mkdir linux-extracted
          tar -xzf linux/Rebellion-linux-x86_64.tar.gz -C linux-extracted

      - name: Extract Windows build
        run: |
          mkdir windows-extracted
          unzip windows/Rebellion-windows-x86_64.zip -d windows-extracted

      - name: Setup butler
        uses: jdno/setup-butler@v1

      - name: Push to itch.io (Linux)
        env:
          BUTLER_API_KEY: ${{ secrets.BUTLER_API_KEY }}
        run: butler push linux-extracted/Rebellion-linux-x86_64 aretedriver/rebellion:linux --userversion ${{ github.ref_name }}

      - name: Push to itch.io (Windows)
        env:
          BUTLER_API_KEY: ${{ secrets.BUTLER_API_KEY }}
        run: butler push windows-extracted/Rebellion-windows-x86_64 aretedriver/rebellion:windows --userversion ${{ github.ref_name }}

      - name: Push to itch.io (Web)
        env:
          BUTLER_API_KEY: ${{ secrets.BUTLER_API_KEY }}
        run: butler push web aretedriver/rebellion:html5 --userversion ${{ github.ref_name }}
