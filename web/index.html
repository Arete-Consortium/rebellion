<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Rebellion — CONCORD Capsuleer Combat Archive</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html, body {
            width: 100%;
            height: 100%;
            background: #050508;
            overflow: hidden;
            font-family: 'Courier New', Courier, monospace;
        }

        #loading {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            background: linear-gradient(135deg, #050508 0%, #0a0a12 100%);
            color: #aaddaa;
            z-index: 1000;
        }

        #loading .archive-header {
            font-size: 0.75rem;
            letter-spacing: 0.2em;
            color: #668866;
            margin-bottom: 2rem;
            text-transform: uppercase;
        }

        #loading h1 {
            font-size: 2.5rem;
            margin-bottom: 0.5rem;
            color: #e0e0e0;
            letter-spacing: 0.05em;
            text-transform: uppercase;
        }

        #loading .subtitle {
            font-size: 1rem;
            color: #889988;
            margin-bottom: 2rem;
            font-style: italic;
        }

        #loading .terminal-line {
            font-size: 0.85rem;
            color: #66aa66;
            margin-bottom: 0.3rem;
            opacity: 0;
            animation: fadeIn 0.5s forwards;
        }

        #loading .terminal-line:nth-child(1) { animation-delay: 0.2s; }
        #loading .terminal-line:nth-child(2) { animation-delay: 0.6s; }
        #loading .terminal-line:nth-child(3) { animation-delay: 1.0s; }
        #loading .terminal-line:nth-child(4) { animation-delay: 1.4s; }

        @keyframes fadeIn {
            to { opacity: 1; }
        }

        .spinner {
            width: 50px;
            height: 50px;
            border: 3px solid #222;
            border-top: 3px solid #66aa66;
            border-radius: 50%;
            animation: spin 1s linear infinite;
            margin-top: 2rem;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        #loading.hidden {
            display: none;
        }

        #bevy-canvas {
            display: block;
            width: 100vw;
            height: 100vh;
        }

        .error {
            color: #ff6666;
            padding: 20px;
            text-align: center;
        }

        .error h2 {
            margin-bottom: 10px;
            color: #ff4444;
        }
    </style>
</head>
<body>
    <canvas id="bevy-canvas"></canvas>
    <div id="loading">
        <div class="archive-header">CONCORD Capsuleer Combat Archive — Historical Reconstruction Program</div>
        <h1>Rebellion</h1>
        <div class="subtitle">Experience history. Learn from it. Survive it.</div>
        <div class="terminal-line">> Neural sync: ONLINE</div>
        <div class="terminal-line">> Fleet telemetry: STREAMING</div>
        <div class="terminal-line">> Historical accuracy: 99.84%</div>
        <div class="terminal-line">> Capsuleer interface: LOADING...</div>
        <div class="spinner"></div>
    </div>

    <script type="module">
        const canvas = document.createElement('canvas');
        const gl = canvas.getContext('webgl2');

        if (!gl) {
            document.getElementById('loading').innerHTML = `
                <div class="error">
                    <h2>WebGL2 Not Supported</h2>
                    <p>Your browser does not support WebGL2, which is required for this simulation.</p>
                    <p>Please try using a modern browser like Chrome, Firefox, or Edge.</p>
                </div>
            `;
            throw new Error('WebGL2 not supported');
        }

        import init from './rebellion.js';

        async function run() {
            setTimeout(() => {
                document.getElementById('loading').classList.add('hidden');
            }, 2500);

            try {
                await init();
            } catch (error) {
                const msg = String(error.message || error);
                const isControlFlow = msg.includes('exceptions for control flow')
                    || msg.includes('don\'t mind me')
                    || msg.includes('not actually an error')
                    || msg.includes('unreachable');
                if (isControlFlow) {
                    return;
                }
                console.error('Failed to initialize:', error);
                document.getElementById('loading').innerHTML = `
                    <div class="error">
                        <h2>Simulation Load Failed</h2>
                        <p>An error occurred while loading the historical reconstruction.</p>
                        <p>${msg}</p>
                    </div>
                `;
            }
        }

        run();
    </script>
</body>
</html>
