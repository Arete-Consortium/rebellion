<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Rebellion — CONCORD Capsuleer Combat Archive</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html, body {
            width: 100%;
            height: 100%;
            background: #050508;
            overflow: hidden;
            font-family: 'Courier New', Courier, monospace;
        }

        #loading {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            background: linear-gradient(135deg, #050508 0%, #0a0a12 100%);
            color: #aaddaa;
            z-index: 1000;
            transition: opacity 0.5s ease;
        }

        #loading.hidden {
            opacity: 0;
            pointer-events: none;
        }

        #loading .archive-header {
            font-size: 0.75rem;
            letter-spacing: 0.2em;
            color: #668866;
            margin-bottom: 2rem;
            text-transform: uppercase;
        }

        #loading h1 {
            font-size: 2.5rem;
            margin-bottom: 0.5rem;
            color: #e0e0e0;
            letter-spacing: 0.05em;
            text-transform: uppercase;
        }

        #loading .subtitle {
            font-size: 1rem;
            color: #889988;
            margin-bottom: 2rem;
            font-style: italic;
        }

        #loading .terminal-line {
            font-size: 0.85rem;
            color: #66aa66;
            margin-bottom: 0.3rem;
            opacity: 0;
            animation: fadeIn 0.5s forwards;
        }

        #loading .terminal-line:nth-child(1) { animation-delay: 0.2s; }
        #loading .terminal-line:nth-child(2) { animation-delay: 0.6s; }
        #loading .terminal-line:nth-child(3) { animation-delay: 1.0s; }
        #loading .terminal-line:nth-child(4) { animation-delay: 1.4s; }

        @keyframes fadeIn {
            to { opacity: 1; }
        }

        .spinner {
            width: 50px;
            height: 50px;
            border: 3px solid #222;
            border-top: 3px solid #66aa66;
            border-radius: 50%;
            animation: spin 1s linear infinite;
            margin-top: 2rem;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        #enter-archive {
            display: none;
            margin-top: 2rem;
            padding: 1rem 2.5rem;
            font-size: 1.1rem;
            font-family: 'Courier New', Courier, monospace;
            letter-spacing: 0.15em;
            text-transform: uppercase;
            color: #e0e0e0;
            background: rgba(102, 170, 102, 0.15);
            border: 2px solid #66aa66;
            cursor: pointer;
            transition: all 0.2s ease;
        }

        #enter-archive:hover {
            background: rgba(102, 170, 102, 0.3);
            color: #ffffff;
            box-shadow: 0 0 20px rgba(102, 170, 102, 0.3);
        }

        #enter-archive:active {
            transform: scale(0.98);
        }

        #enter-archive.visible {
            display: block;
            animation: fadeIn 0.5s forwards;
        }

        #bevy-canvas {
            display: block;
            width: 100vw;
            height: 100vh;
        }

        .error {
            color: #ff6666;
            padding: 20px;
            text-align: center;
        }

        .error h2 {
            margin-bottom: 10px;
            color: #ff4444;
        }
    </style>
</head>
<body>
    <canvas id="bevy-canvas"></canvas>
    <div id="loading">
        <div class="archive-header">CONCORD Capsuleer Combat Archive — Historical Reconstruction Program</div>
        <h1>Rebellion</h1>
        <div class="subtitle">Experience history. Learn from it. Survive it.</div>
        <div class="terminal-line" data-phase="sync">> Neural sync: CONNECTING...</div>
        <div class="terminal-line" data-phase="telemetry">> Fleet telemetry: ACQUIRING...</div>
        <div class="terminal-line" data-phase="accuracy">> Historical accuracy: VERIFYING...</div>
        <div class="terminal-line" data-phase="interface">> Capsuleer interface: STANDBY</div>
        <div class="spinner" id="spinner"></div>
        <button id="enter-archive" type="button">ENTER ARCHIVE</button>
    </div>

    <script type="module">
        const canvas = document.getElementById('bevy-canvas');
        const gl = canvas.getContext('webgl2');

        if (!gl) {
            document.getElementById('loading').innerHTML = `
                <div class="error">
                    <h2>WebGL2 Not Supported</h2>
                    <p>Your browser does not support WebGL2, which is required for this simulation.</p>
                    <p>Please try using a modern browser like Chrome, Firefox, or Edge.</p>
                </div>
            `;
            throw new Error('WebGL2 not supported');
        }

        import init from './rebellion.js';

        const loading = document.getElementById('loading');
        const spinner = document.getElementById('spinner');
        const enterBtn = document.getElementById('enter-archive');

        // Update terminal lines during load
        const lines = loading.querySelectorAll('.terminal-line');
        let initError = null;
        let wasmReady = false;

        async function run() {
            try {
                await init();
                wasmReady = true;

                // Update terminal to READY state
                lines.forEach(line => {
                    const phase = line.dataset.phase;
                    if (phase === 'sync') line.textContent = '> Neural sync: ONLINE';
                    if (phase === 'telemetry') line.textContent = '> Fleet telemetry: STREAMING';
                    if (phase === 'accuracy') line.textContent = '> Historical accuracy: 99.84%';
                    if (phase === 'interface') line.textContent = '> Capsuleer interface: READY';
                });

                // Hide spinner, show ENTER ARCHIVE button
                spinner.style.display = 'none';
                enterBtn.classList.add('visible');

            } catch (error) {
                initError = error;
                const msg = String(error.message || error);
                const isControlFlow = msg.includes('exceptions for control flow')
                    || msg.includes('don\'t mind me')
                    || msg.includes('not actually an error')
                    || msg.includes('unreachable');

                if (isControlFlow) {
                    // Rust panic-to-unwind control flow — not a real error
                    wasmReady = true;
                    spinner.style.display = 'none';
                    enterBtn.classList.add('visible');
                    return;
                }

                console.error('Failed to initialize:', error);
                spinner.style.display = 'none';
                lines.forEach(line => {
                    line.style.color = '#ff6666';
                    line.style.opacity = '1';
                });
                loading.innerHTML += `
                    <div class="error">
                        <h2>Simulation Load Failed</h2>
                        <p>An error occurred while loading the historical reconstruction.</p>
                        <p>${msg}</p>
                    </div>
                `;
            }
        }

        // ENTER ARCHIVE click handler
        enterBtn.addEventListener('click', () => {
            if (!wasmReady) return;

            // Hide loading overlay
            loading.classList.add('hidden');

            // Focus canvas for keyboard input
            canvas.focus();

            // Attempt to unlock audio context via user gesture
            if (typeof AudioContext !== 'undefined') {
                const audioCtx = new AudioContext();
                if (audioCtx.state === 'suspended') {
                    audioCtx.resume().catch(() => {});
                }
            }
        });

        // Also allow Enter/Space/Gamepad A to start
        window.addEventListener('keydown', (e) => {
            if (!wasmReady) return;
            if (e.code === 'Enter' || e.code === 'Space') {
                if (!loading.classList.contains('hidden')) {
                    e.preventDefault();
                    enterBtn.click();
                }
            }
        });

        // Start WASM initialization immediately
        run();
    </script>
</body>
</html>
