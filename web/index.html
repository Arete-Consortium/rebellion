<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Rebellion — CONCORD Capsuleer Combat Archive</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html, body {
            width: 100%;
            height: 100%;
            background: #050508;
            overflow: hidden;
            font-family: 'Courier New', Courier, monospace;
        }

        #loading {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            background: linear-gradient(135deg, #050508 0%, #0a0a12 100%);
            color: #aaddaa;
            z-index: 1000;
            transition: opacity 0.5s ease;
        }

        #loading.hidden {
            opacity: 0;
            pointer-events: none;
        }

        #loading .archive-header {
            font-size: 0.75rem;
            letter-spacing: 0.2em;
            color: #668866;
            margin-bottom: 2rem;
            text-transform: uppercase;
        }

        #loading h1 {
            font-size: 2.5rem;
            margin-bottom: 0.5rem;
            color: #e0e0e0;
            letter-spacing: 0.05em;
            text-transform: uppercase;
        }

        #loading .subtitle {
            font-size: 1rem;
            color: #889988;
            margin-bottom: 2rem;
            font-style: italic;
        }

        #loading .terminal-line {
            font-size: 0.85rem;
            color: #66aa66;
            margin-bottom: 0.3rem;
            opacity: 0;
            animation: fadeIn 0.5s forwards;
        }

        #loading .terminal-line:nth-child(1) { animation-delay: 0.2s; }
        #loading .terminal-line:nth-child(2) { animation-delay: 0.6s; }
        #loading .terminal-line:nth-child(3) { animation-delay: 1.0s; }
        #loading .terminal-line:nth-child(4) { animation-delay: 1.4s; }

        @keyframes fadeIn {
            to { opacity: 1; }
        }

        .spinner {
            width: 50px;
            height: 50px;
            border: 3px solid #222;
            border-top: 3px solid #66aa66;
            border-radius: 50%;
            animation: spin 1s linear infinite;
            margin-top: 2rem;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        #bevy-canvas {
            display: block;
            width: 100vw;
            height: 100vh;
        }

        .error {
            color: #ff6666;
            padding: 20px;
            text-align: center;
        }

        .error h2 {
            margin-bottom: 10px;
            color: #ff4444;
        }
    </style>
</head>
<body>
    <canvas id="bevy-canvas" tabindex="0" aria-label="Rebellion controller game"></canvas>
    <div id="loading" role="status" aria-live="polite">
        <div class="archive-header">CONCORD Capsuleer Combat Archive — Historical Reconstruction Program</div>
        <h1>Rebellion</h1>
        <div class="subtitle">Experience history. Learn from it. Survive it.</div>
        <div class="terminal-line" data-phase="sync">> Neural sync: CONNECTING...</div>
        <div class="terminal-line" data-phase="telemetry">> Fleet telemetry: ACQUIRING...</div>
        <div class="terminal-line">> Controller required: connect and press a button</div>
        <div class="terminal-line">> Release controls, then press and release A when prompted</div>
        <div class="spinner" id="spinner"></div>
    </div>

    <script type="module">
        const canvas = document.getElementById('bevy-canvas');
        const loading = document.getElementById('loading');
        let failed = false;

        // Winit's event-loop handoff is expected; a generic WASM "unreachable"
        // is a real panic and must remain visible to the player and tester.
        function isEventLoopHandoff(error) {
            const message = String(error?.message ?? error);
            return message.includes('Using exceptions for control flow, don\'t mind me.');
        }

        function showGame() {
            if (failed) return;
            loading.classList.add('hidden');
            loading.setAttribute('aria-hidden', 'true');
            canvas.focus();
        }

        function showError(error) {
            if (isEventLoopHandoff(error)) return;
            failed = true;
            console.error('Rebellion runtime failed:', error);
            const panel = document.createElement('div');
            panel.className = 'error';
            const title = document.createElement('h2');
            title.textContent = 'Simulation unavailable';
            const message = document.createElement('p');
            message.textContent = String(error?.message ?? error);
            const help = document.createElement('p');
            help.textContent = 'Reload to try again. If this repeats, include this message in your playtest report.';
            panel.append(title, message, help);
            loading.replaceChildren(panel);
            loading.classList.remove('hidden');
            loading.removeAttribute('aria-hidden');
        }

        window.addEventListener('error', (event) => {
            showError(event.error ?? event.message);
        });
        window.addEventListener('unhandledrejection', (event) => {
            showError(event.reason);
        });

        async function run() {
            try {
                // Probe separately so the game creates its own context with
                // the renderer's required attributes on #bevy-canvas.
                const probe = document.createElement('canvas');
                const gl = probe.getContext('webgl2');
                if (!gl) throw new Error('WebGL2 is unavailable. Enable browser hardware acceleration and reload.');
                gl.getExtension('WEBGL_lose_context')?.loseContext();

                // Dynamic import makes a missing JS module a visible failure.
                const { default: init } = await import('./rebellion.js');
                try {
                    await init();
                } catch (error) {
                    if (!isEventLoopHandoff(error)) throw error;
                }
                // The game's controller gate owns neutral/A/release and
                // disconnect handling; no second web-only input gate is needed.
                showGame();
            } catch (error) {
                showError(error);
            }
        }

        run();
    </script>
</body>
</html>
